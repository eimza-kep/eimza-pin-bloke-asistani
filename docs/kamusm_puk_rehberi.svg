<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="900" height="70" rx="16" fill="#1e293b" opacity="0.8"/>
  <rect x="40" y="24" width="22" height="22" rx="4" fill="url(#accentGrad)"/>
  <text x="72" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">TÜBİTAK Kamu SM e-Devlet ile PUK Sorgulama ve PIN Sıfırlama</text>
  <text x="750" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">eimza-kep / v1.3</text>

  <!-- Step 1 -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="180" height="260" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="90" y="52" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">1</text>
    <text x="90" y="95" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">e-Devlet Girişi</text>
    <text x="90" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">kisisel.kamusm.gov.tr</text>
    <rect x="25" y="145" width="130" height="32" rx="6" fill="#dc2626"/>
    <text x="90" y="166" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">e-Devlet ile Giriş</text>
    <text x="90" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">TC Kimlik ve şifrenizle</text>
    <text x="90" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">güvenli oturum açın</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 230 230 L 250 230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(255, 100)" filter="url(#shadow)">
    <rect width="180" height="260" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="90" y="52" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">2</text>
    <text x="90" y="95" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">İşlemler Menüsü</text>
    <rect x="20" y="120" width="140" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="140" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PIN / PUK İşlemleri</text>
    <text x="90" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Kart listesinden ilgili</text>
    <text x="90" y="198" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Mali Mühür / E-İmza</text>
    <text x="90" y="216" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">kartınızı seçin</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(470, 100)" filter="url(#shadow)">
    <rect width="180" height="260" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#10b981" fill-opacity="0.2"/>
    <text x="90" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">3</text>
    <text x="90" y="95" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">PUK Kodunu Al</text>
    <rect x="20" y="120" width="140" height="40" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="90" y="145" fill="#a7f3d0" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">PUK: 87492163</text>
    <text x="90" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">8 haneli PUK kodunu</text>
    <text x="90" y="203" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">not alın (3 hatalı</text>
    <text x="90" y="221" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PUK kartı yakar!)</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(685, 100)" filter="url(#shadow)">
    <rect width="175" height="260" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="87" cy="45" r="24" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="87" y="52" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">4</text>
    <text x="87" y="95" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">AKİS'te Sıfırla</text>
    <rect x="20" y="120" width="135" height="30" rx="4" fill="#1e40af"/>
    <text x="87" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PIN Kilidi Aç</text>
    <text x="87" y="175" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">AKİS Kart İzleme Aracı</text>
    <text x="87" y="193" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">PUK ve yeni 6 haneli</text>
    <text x="87" y="211" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PIN'inizi girip onaylayın</text>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="40" y="375" width="820" height="30" rx="6" fill="#0f172a" opacity="0.6"/>
  <text x="450" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">💡 Güvenli yeni PIN oluşturmak için: <tspan fill="#38bdf8" font-family="monospace">python pin_assistant.py --generate-pin</tspan></text>
</svg>
