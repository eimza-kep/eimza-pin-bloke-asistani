<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="#0f172a" rx="12"/>

  <!-- AKIS Window Container -->
  <g transform="translate(60, 30)" filter="url(#winShadow)">
    <!-- Window Body -->
    <rect width="680" height="380" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <path d="M 0 8 Q 0 0 8 0 L 672 0 Q 680 0 680 8 L 680 34 L 0 34 Z" fill="#1e293b"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="5" fill="#10b981"/>
    <text x="340" y="22" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AKİS Kart İzleme Aracı v4.x — TÜBİTAK BİLGEM</text>

    <!-- Left Sidebar -->
    <rect x="0" y="34" width="200" height="346" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="12" y="50" width="176" height="32" rx="4" fill="#e2e8f0"/>
    <text x="24" y="70" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">💳 Akıllı Kart (Takılı)</text>
    
    <text x="24" y="115" fill="#475569" font-family="system-ui, sans-serif" font-size="12">📜 Sertifikalar</text>
    <text x="24" y="145" fill="#475569" font-family="system-ui, sans-serif" font-size="12">⚙️ Kart Ayarları</text>
    <text x="24" y="175" fill="#475569" font-family="system-ui, sans-serif" font-size="12">ℹ️ Kart Bilgisi</text>

    <!-- Main Content Area -->
    <rect x="220" y="50" width="440" height="60" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="235" y="75" fill="#991b1b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">⚠️ KART DURUMU: PIN KİLİTLİ (BLOKE)</text>
    <text x="235" y="95" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11">PIN kodu 3 kez hatalı girilmiştir. PUK kodu ile sıfırlanmalıdır.</text>

    <!-- Modal Dialog (PIN Kilidi Ac) -->
    <g transform="translate(240, 130)">
      <rect width="400" height="220" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#winShadow)"/>
      <rect x="0" y="0" width="400" height="30" rx="4" fill="#3b82f6"/>
      <text x="200" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PIN Kilidi Açma (PUK ile Yeni PIN Belirleme)</text>
      
      <!-- PUK Input -->
      <text x="25" y="60" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PUK Kodu (8 Hane):</text>
      <rect x="180" y="45" width="190" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="190" y="62" fill="#0f172a" font-family="monospace" font-size="12">87492163</text>

      <!-- New PIN Input -->
      <text x="25" y="98" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Yeni PIN (6-8 Rakam):</text>
      <rect x="180" y="83" width="190" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="190" y="100" fill="#0f172a" font-family="monospace" font-size="12">•••••• (482915)</text>

      <!-- New PIN Confirm -->
      <text x="25" y="136" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Yeni PIN Tekrar:</text>
      <rect x="180" y="121" width="190" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="190" y="138" fill="#0f172a" font-family="monospace" font-size="12">•••••• (482915)</text>

      <!-- Action Buttons -->
      <rect x="180" y="170" width="90" height="30" rx="4" fill="#10b981"/>
      <text x="225" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">KİLİDİ AÇ</text>

      <rect x="280" y="170" width="90" height="30" rx="4" fill="#94a3b8"/>
      <text x="325" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">İptal</text>
    </g>
  </g>
</svg>
